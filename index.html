<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07162c">
  <meta name="description" content="PWA para registro guiado de boletins de ocorrência da Segurança Patrimonial.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>BO Digital GSP</title>
</head>
<body>
  <div id="app-shell">
    <header class="app-header">
      <button id="back-button" class="icon-button hidden" type="button" aria-label="Voltar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="brand">
        <img src="assets/icon-192.png" alt="" class="brand-icon">
        <div>
          <strong id="header-title">BO Digital GSP</strong>
          <span id="header-subtitle">Banco local + Google Sheets</span>
        </div>
      </div>
      <button id="install-button" class="header-action hidden" type="button">Instalar</button>
    </header>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item active" data-route="home" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <span>Início</span>
      </button>
      <button class="nav-item" data-route="records" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4"/></svg>
        <span>Boletins</span>
      </button>
      <button class="nav-item" data-route="about" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM7 10h10M7 14h7"/></svg>
        <span>Banco</span>
      </button>
    </nav>
  </div>

  <dialog id="entity-dialog" class="entity-dialog">
    <form method="dialog" class="dialog-card" id="entity-form">
      <div class="dialog-header">
        <div>
          <p class="eyebrow" id="dialog-eyebrow">Cadastro</p>
          <h2 id="dialog-title">Adicionar</h2>
        </div>
        <button type="button" class="icon-button" id="dialog-close" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
      <div class="dialog-actions">
        <button type="button" class="button secondary" id="dialog-cancel">Cancelar</button>
        <button type="submit" class="button primary" id="dialog-save">Salvar</button>
      </div>
    </form>
  </dialog>

  <button id="bot-fab" class="bot-fab" type="button" aria-label="Abrir assistente do preenchimento">
    <img src="assets/bot-guardian.png" alt="Assistente Guardião">
    <span>Guardião</span>
  </button>

  <aside id="bot-panel" class="bot-panel" aria-label="Assistente Guardião" aria-hidden="true">
    <div class="bot-panel-head">
      <div class="bot-id">
        <img src="assets/bot-guardian.png" alt="">
        <div><strong>Guardião GSP</strong><span><i></i> Assistente de preenchimento</span></div>
      </div>
      <button id="bot-close" class="icon-button" type="button" aria-label="Fechar assistente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="bot-messages" class="bot-messages" aria-live="polite"></div>
    <div id="bot-chips" class="bot-chips"></div>
    <div class="bot-composer">
      <input id="bot-input" type="text" placeholder="Pergunte sobre o preenchimento..." autocomplete="off">
      <button id="bot-send" type="button" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8zM11 13l10-10"/></svg>
      </button>
    </div>
  </aside>
  <div id="bot-backdrop" class="bot-backdrop hidden"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
