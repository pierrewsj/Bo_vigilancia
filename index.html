<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c12">
  <meta name="description" content="PWA para registro guiado de boletins de ocorrência da Segurança Patrimonial.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>BO Digital GSP</title>
</head>
<body>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div id="app-shell">
    <header class="app-header">
      <button id="back-button" class="icon-button hidden" type="button" aria-label="Voltar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="brand">
        <img src="assets/icon-192.png" alt="" class="brand-icon">
        <div class="brand-copy">
          <strong id="header-title">BO Digital GSP</strong>
          <span id="header-subtitle">Registro de ocorrências</span>
        </div>
      </div>
      <div class="header-tools">
        <span id="header-sync" class="header-sync" title="Situação do banco"><i></i></span>
        <button id="install-button" class="header-action hidden" type="button">Instalar</button>
      </div>
    </header>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item active" data-route="home" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <span>Início</span>
      </button>
      <button class="nav-item" data-route="records" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4"/></svg>
        <span>Boletins</span>
      </button>
      <button class="nav-item" data-route="about" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        <span>Banco</span>
      </button>
    </nav>
  </div>

  <dialog id="entity-dialog" class="entity-dialog">
    <form method="dialog" class="dialog-card" id="entity-form" novalidate>
      <div class="dialog-header">
        <div>
          <p class="eyebrow" id="dialog-eyebrow">Cadastro</p>
          <h2 id="dialog-title">Adicionar</h2>
        </div>
        <button type="button" class="icon-button" id="dialog-close" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
      <div class="dialog-actions">
        <button type="button" class="button secondary" id="dialog-cancel">Cancelar</button>
        <button type="submit" class="button primary" id="dialog-save">Salvar cadastro</button>
      </div>
    </form>
  </dialog>

  <dialog id="app-dialog" class="app-dialog">
    <div class="app-dialog-card">
      <div id="app-dialog-icon" class="app-dialog-icon"></div>
      <p id="app-dialog-eyebrow" class="eyebrow">Confirmação</p>
      <h2 id="app-dialog-title">Confirmar ação</h2>
      <div id="app-dialog-message" class="app-dialog-message"></div>
      <div id="app-dialog-details" class="app-dialog-details hidden"></div>
      <div class="app-dialog-actions">
        <button id="app-dialog-cancel" class="button secondary" type="button">Cancelar</button>
        <button id="app-dialog-confirm" class="button primary" type="button">Confirmar</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
