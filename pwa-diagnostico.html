<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Diagnóstico PWA</title><style>body{font-family:Arial;background:#07111b;color:#eef8ff;padding:20px}pre{white-space:pre-wrap;background:#101d2a;padding:16px;border-radius:14px}</style></head><body><h1>Diagnóstico PWA</h1><pre id='out'>Verificando...</pre><script>(async()=>{const out=[];out.push('URL: '+location.href);out.push('HTTPS/seguro: '+window.isSecureContext);out.push('Standalone: '+matchMedia('(display-mode: standalone)').matches);try{const m=await fetch('./manifest.json',{cache:'no-store'});out.push('Manifest HTTP: '+m.status+' '+m.headers.get('content-type'));out.push(await m.text())}catch(e){out.push('Erro no manifest: '+e.message)}try{const r=await navigator.serviceWorker.getRegistration('./');out.push('Service worker: '+(r?'registrado':'não registrado'));if(r)out.push('SW ativo: '+Boolean(r.active)+' | esperando: '+Boolean(r.waiting)+' | instalando: '+Boolean(r.installing))}catch(e){out.push('Erro SW: '+e.message)}document.querySelector('#out').textContent=out.join('

')})()</script></body></html>
